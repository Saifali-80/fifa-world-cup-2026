  <style>
    :root{
      --bg:#FAF7F3;
      --bg2:#F2EDE4;
      --line:#E5D7C6;
      --accent:#D9A299;
      --accent2:#C9883A;
      --ink:#1a1410;
      --ink2:#7a6d5e;
      --ink3:#a89a87;
      --card-bg:#FFFFFF;
      --card-border:rgba(26,20,16,.08);
      --card-shadow:0 2px 12px rgba(26,20,16,.06), 0 8px 32px rgba(26,20,16,.04);
      --card-shadow-hover:0 8px 32px rgba(26,20,16,.10), 0 24px 64px rgba(26,20,16,.08);
      --sans:'Plus Jakarta Sans','Helvetica Neue',system-ui,sans-serif;
      --serif:'Playfair Display',Georgia,serif;
      --ease:cubic-bezier(0.85,0,0.15,1);
      --ease-out:cubic-bezier(0.22,1,0.36,1);
    }
    html.dark{
      --bg:#1a1410;
      --bg2:#221c16;
      --line:#3a302a;
      --ink:#f4ede2;
      --ink2:#a89c8b;
      --ink3:#6b6358;
      --card-bg:#231d17;
      --card-border:rgba(244,237,226,.07);
      --card-shadow:0 2px 12px rgba(0,0,0,.18), 0 8px 32px rgba(0,0,0,.14);
      --card-shadow-hover:0 8px 40px rgba(0,0,0,.28), 0 24px 72px rgba(0,0,0,.18);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
    body{transition:background-color .5s var(--ease),color .5s var(--ease)}
    img{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
    ::selection{background:var(--accent);color:var(--bg)}

    .top-bar{
      position:fixed;top:0;left:0;right:0;height:72px;z-index:33;
      background:var(--bg);border-bottom:1px solid transparent;
      transition:background .5s var(--ease), border-color .3s;
    }
    .top-bar.scrolled{border-color:var(--line)}
    .brand-logo{
      position:fixed;top:26px;left:36px;z-index:36;
      font-family:var(--serif);font-weight:800;font-size:15px;color:var(--ink);
      opacity:1;pointer-events:auto;
      transition:color .5s var(--ease);
    }
    .brand-logo:hover{color:var(--accent2)}
    .theme-toggle{
      position:fixed;top:24px;right:36px;z-index:38;
      width:36px;height:36px;
      display:flex;align-items:center;justify-content:center;
      background:var(--card-bg);border:1px solid var(--card-border);
      border-radius:50%;cursor:pointer;color:var(--ink2);
      transition:all .35s var(--ease);
    }
    .theme-toggle:hover{color:var(--ink);background:var(--bg2)}
    .theme-toggle svg{width:15px;height:15px}
    .theme-toggle .icon-sun{display:none}
    html.dark .theme-toggle .icon-sun{display:block}
    html.dark .theme-toggle .icon-moon{display:none}
    .top-nav{
      position:fixed;top:28px;right:88px;z-index:35;
      display:flex;gap:4px;
      opacity:1;
    }
    .top-nav a{
      color:var(--ink2);
      font-size:12px;font-weight:600;letter-spacing:.06em;
      padding:5px 12px;border-radius:20px;
      transition:color .25s, background .25s;
    }
    .top-nav a:hover{color:var(--ink);background:var(--bg2)}
    .top-nav a.active{color:var(--ink);background:var(--bg2)}

    main{padding:100px clamp(20px,3vw,40px) 60px;max-width:1000px;margin:0 auto}

    .back-link{
      display:inline-flex;align-items:center;gap:6px;
      color:var(--ink2);font-size:14px;font-weight:600;
      margin-bottom:24px;transition:color .25s;
    }
    .back-link:hover{color:var(--ink)}

    /* ─── FILTER BAR ─── */
    .filter-bar{
      display:flex;gap:8px;flex-wrap:wrap;margin-bottom:36px;
    }
    .filter-bar button{
      padding:6px 16px;
      border:1px solid var(--card-border);
      border-radius:20px;
      background:transparent;
      color:var(--ink2);
      font:600 12px var(--sans);
      cursor:pointer;
      transition:all .3s var(--ease);
    }
    .filter-bar button:hover{
      border-color:var(--accent);
      color:var(--ink);
      background:var(--bg2);
    }
    .filter-bar button.active{
      background:var(--accent);
      color:var(--bg);
      border-color:var(--accent);
    }

    .stadium-hero{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-bottom:48px}
    .stadium-hero img{width:100%;height:300px;object-fit:cover;border-radius:16px;background:var(--bg2)}
    .stadium-hero .info h1{
      font-family:var(--serif);
      font-size:clamp(32px,3.4vw,48px);
      font-weight:800;letter-spacing:-.02em;color:var(--ink);
      margin-bottom:4px;
    }
    .stadium-hero .info .city{font-size:18px;color:var(--ink2);margin-bottom:12px}
    .stadium-hero .info .meta{display:flex;flex-wrap:wrap;gap:24px;font-size:14px;color:var(--ink2)}
    .stadium-hero .info .meta b{color:var(--ink);font-weight:700}
    .stadium-hero .info .country-badge{
      display:inline-block;padding:4px 14px;border-radius:10px;
      font-size:12px;font-weight:700;color:#fff;margin-bottom:10px;
    }

    .section-title{
      font-family:var(--serif);
      font-size:26px;font-weight:800;color:var(--ink);
      margin-bottom:20px;
      display:flex;align-items:center;gap:12px;
    }
    .section-title .count{font-size:14px;font-weight:600;color:var(--ink3);font-family:var(--sans)}

    .match-list{display:flex;flex-direction:column;gap:8px}
    .match-row{
      display:grid;grid-template-columns:80px 1fr 50px 1fr 120px;
      gap:12px;align-items:center;
      padding:14px 18px;
      border:1px solid var(--line);
      border-radius:12px;
      color:inherit;
      transition:border-color .3s, background .3s;
    }
    .match-row:hover{background:var(--bg2);border-color:var(--accent)}
    .match-row .date{font-size:12px;color:var(--ink2);font-weight:500}
    .match-row .date b{color:var(--ink);display:block;font-weight:700;font-size:14px}
    .match-row .team{font-weight:600;color:var(--ink);font-size:15px}
    .match-row .team.away{text-align:right}
    .match-row .vs{font-size:11px;font-weight:700;color:var(--ink3);text-align:center;text-transform:uppercase;letter-spacing:.06em}
    .match-row .venue{font-size:12px;color:var(--ink3);text-align:right}
    .match-row .venue b{color:var(--ink);display:block;font-weight:600}
    .match-row .score{font-size:18px;font-weight:800;color:var(--accent2);text-align:center}

    .empty-state{text-align:center;padding:60px 20px;color:var(--ink2)}
    .empty-state .icon{font-size:48px;margin-bottom:12px}
    .empty-state h3{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:6px}

    .footer{
      border-top:1px solid var(--line);
      padding:32px clamp(20px,3vw,40px);
      display:flex;justify-content:space-between;align-items:baseline;
      font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);
      max-width:1280px;margin:0 auto;
    }
    .footer b{color:var(--ink);font-weight:600}

    @media (max-width:720px){
      .top-nav{display:none!important}
      .stadium-hero{grid-template-columns:1fr;gap:24px}
      .stadium-hero img{height:200px}
      .match-row{grid-template-columns:1fr;gap:6px;text-align:center;padding:16px}
      .match-row .team.away{text-align:center}
      .match-row .venue{text-align:center}
      .match-row .score{font-size:24px;padding:4px 0}
      .filter-bar{justify-content:center}
      .filter-bar button{font-size:11px;padding:5px 12px}
    }

</head>

<script>
  const themeToggle = document.getElementById('themeToggle');
  const topBar = document.getElementById('topBar');
  function applyTheme(t){ document.documentElement.classList.toggle('dark', t === 'dark'); }
  const saved = localStorage.getItem('wc.theme');
  const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (sysDark ? 'dark' : 'light'));
  themeToggle.addEventListener('click', () => {
    const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
    applyTheme(next);
    localStorage.setItem('wc.theme', next);
  });
  window.addEventListener('scroll', () => {
    topBar.classList.toggle('scrolled', window.scrollY > 20);
  });
</script>

        { n: 48, date: '2026-07-04T22:00:00Z', kick: '22:00', home: 'Nigeria', away: 'Wales', group: 'D' }
      ]
    }
  };

  // ─── RENDER ───
  function monthDay(d){
    const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dt = new Date(d);
    return `${m[dt.getUTCMonth()]} ${dt.getUTCDate()}`;
  }

  function dayOfWeek(d){
    const w = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    return w[new Date(d).getUTCDay()];
  }

  function renderStadium(countryFilter) {
    // Find stadium by ID (always show the requested stadium)
    const stadium = STADIUMS[id];
    
    if(!stadium){
      el.innerHTML = `
        <div class="empty-state">
          <div class="icon">🏟️</div>
          <h3>Stadium not found</h3>
          <p style="color:var(--ink2);margin-top:8px">The stadium you're looking for doesn't exist.</p>
          <a href="./stadiums.html" style="display:inline-block;margin-top:20px;font-weight:700;color:var(--accent2);border-bottom:1.5px solid var(--accent2);padding-bottom:2px">← Back to stadiums</a>
        </div>
      `;
      return;
    }

    const matches = stadium.matches || [];
    const countryFlags = { 'Mexico':'🇲🇽', 'USA':'🇺🇸', 'Canada':'🇨🇦' };

    // Filter matches by country if not "all"
    let filteredMatches = matches;
    if(countryFilter !== 'all'){
      // Get all stadium IDs for that country
      const countryStadiumIds = Object.keys(STADIUMS).filter(key => STADIUMS[key].country === countryFilter);
      // If current stadium is in that country, show its matches, else show empty
      if(countryStadiumIds.includes(id)){
        filteredMatches = matches;
      } else {
        filteredMatches = [];
      }
    }

    let matchHTML = '';
    if(filteredMatches.length === 0){
      matchHTML = `
        <div class="empty-state">
          <div class="icon">📅</div>
          <h3>No matches in this country</h3>
          <p style="color:var(--ink2);margin-top:8px">This stadium doesn't have matches in the selected country.</p>
        </div>
      `;
    } else {
      matchHTML = filteredMatches.map(m => {
        const isFinal = m.group === 'Final';
        return `
          <a class="match-row" href="./match.html?n=${m.n}">
            <span class="date">
              <b>${monthDay(m.date)}</b>
              ${dayOfWeek(m.date)} · ${m.kick || ''}
            </span>
            <span class="team">${m.home}</span>
            <span class="score">vs</span>
            <span class="team away">${m.away}</span>
            <span class="venue">
              <b>${isFinal ? '🏆 Final' : 'Group '+m.group}</b>
            </span>
          </a>
        `;
      }).join('');
    }

    el.innerHTML = `
      <div class="stadium-hero">
        <img src="./stadiums/${id}.webp" alt="${stadium.stadium}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22300%22%3E%3Crect width=%22600%22 height=%22300%22 fill=%22%23E5D7C6%22/%3E%3Ctext x=%22300%22 y=%22160%22 text-anchor=%22middle%22 fill=%22%237a6d5e%22 font-size=%2228%22 font-family=%22sans-serif%22%3E${stadium.stadium}%3C/text%3E%3C/svg%3E'">
        <div class="info">
          <div class="country-badge" style="background:${stadium.countryColor}">${countryFlags[stadium.country] || '🏟️'} ${stadium.country}</div>
          <h1>${stadium.stadium}</h1>
          <div class="city">📍 ${stadium.city}</div>
          <div class="meta">
            <span>🏟️ <b>${stadium.capacity.toLocaleString()}</b> seats</span>
            <span>📅 <b>${filteredMatches.length}</b> matches</span>
          </div>
        </div>
      </div>

      <div class="section-title">
        All Matches
        <span class="count">(${filteredMatches.length} fixtures)</span>
      </div>

      <div class="match-list">
        ${matchHTML}
      </div>
    `;
  }

  // ─── FILTER CLICK ───
  filterBar.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    filterBar.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderStadium(btn.dataset.country);
  });

  // ─── INITIAL RENDER ───
  if(id && STADIUMS[id]){
    renderStadium('all');
  } else {
    el.innerHTML = `
      <div class="empty-state">
        <div class="icon">🏟️</div>
        <h3>Stadium not found</h3>
        <p style="color:var(--ink2);margin-top:8px">The stadium you're looking for doesn't exist.</p>
        <a href="./stadiums.html" style="display:inline-block;margin-top:20px;font-weight:700;color:var(--accent2);border-bottom:1.5px solid var(--accent2);padding-bottom:2px">← Back to stadiums</a>
      </div>
    `;
  }
})();
</script>

<script src="./mobile-nav.js"></script>
</body>
</html>
