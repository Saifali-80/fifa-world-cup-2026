<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>(function(){try{var t=localStorage.getItem("wc.theme");if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";if(t==="dark")document.documentElement.classList.add("dark")}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="./trophy/cup-trophy.webp">
  <title>Matches · World Cup 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#FAF7F3;
      --bg2:#F2EDE4;
      --line:#E5D7C6;
      --accent:#D9A299;
      --accent2:#C9883A;
      --ink:#1a1410;
      --ink2:#7a6d5e;
      --ink3:#a89a87;
      --card-bg:#FFFFFF;
      --card-border:rgba(26,20,16,.08);
      --card-shadow:0 2px 12px rgba(26,20,16,.06), 0 8px 32px rgba(26,20,16,.04);
      --card-shadow-hover:0 8px 32px rgba(26,20,16,.10), 0 24px 64px rgba(26,20,16,.08);
      --sans:'Plus Jakarta Sans','Helvetica Neue',system-ui,sans-serif;
      --serif:'Playfair Display',Georgia,serif;
      --ease:cubic-bezier(0.85,0,0.15,1);
      --ease-out:cubic-bezier(0.22,1,0.36,1);
    }
    html.dark{
      --bg:#1a1410;
      --bg2:#221c16;
      --line:#3a302a;
      --ink:#f4ede2;
      --ink2:#a89c8b;
      --ink3:#6b6358;
      --card-bg:#231d17;
      --card-border:rgba(244,237,226,.07);
      --card-shadow:0 2px 12px rgba(0,0,0,.18), 0 8px 32px rgba(0,0,0,.14);
      --card-shadow-hover:0 8px 40px rgba(0,0,0,.28), 0 24px 72px rgba(0,0,0,.18);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
    body{transition:background-color .5s var(--ease),color .5s var(--ease)}
    img{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
    ::selection{background:var(--accent);color:var(--bg)}

    .top-bar{
      position:fixed;top:0;left:0;right:0;height:72px;z-index:33;
      background:var(--bg);border-bottom:1px solid transparent;
      transition:background .5s var(--ease), border-color .3s;
    }
    .top-bar.scrolled{border-color:var(--line)}
    .brand-logo{
      position:fixed;top:26px;left:36px;z-index:36;
      font-family:var(--serif);font-weight:800;font-size:15px;color:var(--ink);
      opacity:1;pointer-events:auto;
      transition:color .5s var(--ease);
    }
    .brand-logo:hover{color:var(--accent2)}
    .theme-toggle{
      position:fixed;top:24px;right:36px;z-index:38;
      width:36px;height:36px;
      display:flex;align-items:center;justify-content:center;
      background:var(--card-bg);border:1px solid var(--card-border);
      border-radius:50%;cursor:pointer;color:var(--ink2);
      transition:all .35s var(--ease);
    }
    .theme-toggle:hover{color:var(--ink);background:var(--bg2)}
    .theme-toggle svg{width:15px;height:15px}
    .theme-toggle .icon-sun{display:none}
    html.dark .theme-toggle .icon-sun{display:block}
    html.dark .theme-toggle .icon-moon{display:none}
    .top-nav{
      position:fixed;top:28px;right:88px;z-index:35;
      display:flex;gap:4px;
      opacity:1;
    }
    .top-nav a{
      color:var(--ink2);
      font-size:12px;font-weight:600;letter-spacing:.06em;
      padding:5px 12px;border-radius:20px;
      transition:color .25s, background .25s;
    }
    .top-nav a:hover{color:var(--ink);background:var(--bg2)}
    .top-nav a.active{color:var(--ink);background:var(--bg2)}

    main{padding:100px clamp(20px,3vw,40px) 60px;max-width:1280px;margin:0 auto}

    .page-header{margin-bottom:48px}
    .page-header h1{
      font-family:var(--serif);
      font-size:clamp(36px,4vw,60px);
      font-weight:800;letter-spacing:-.03em;color:var(--ink);
      margin-bottom:8px;
    }
    .page-header p{font-size:18px;color:var(--ink2)}

    .back-link{
      display:inline-flex;align-items:center;gap:6px;
      color:var(--ink2);font-size:14px;font-weight:600;
      margin-bottom:24px;transition:color .25s;
    }
    .back-link:hover{color:var(--ink)}

    /* ─── FILTER BAR ─── */
    .filter-bar{
      display:flex;gap:8px;flex-wrap:wrap;margin-bottom:36px;
    }
    .filter-bar button{
      padding:6px 16px;
      border:1px solid var(--card-border);
      border-radius:20px;
      background:transparent;
      color:var(--ink2);
      font:600 12px var(--sans);
      cursor:pointer;
      transition:all .3s var(--ease);
    }
    .filter-bar button:hover{
      border-color:var(--accent);
      color:var(--ink);
      background:var(--bg2);
    }
    .filter-bar button.active{
      background:var(--accent);
      color:var(--bg);
      border-color:var(--accent);
    }

    .match-list{display:flex;flex-direction:column;gap:4px}
    .date-group-head{
      display:flex;align-items:center;gap:14px;
      padding:20px 4px 10px;
      font-size:11px;font-weight:700;letter-spacing:.1em;
      text-transform:uppercase;color:var(--ink3);
    }
    .date-group-head:first-child{padding-top:0}
    .date-group-head::after{content:'';flex:1;height:1px;background:var(--line)}

    .match-row{
      display:grid;grid-template-columns:72px 48px 1fr 48px 1fr 140px;
      gap:12px;align-items:center;
      padding:14px 16px;
      background:var(--card-bg);border:1px solid var(--card-border);
      border-radius:12px;box-shadow:var(--card-shadow);
      transition:all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      color:inherit;
      position:relative;
      will-change:transform;
      opacity:0;
      animation: slideUpFade 0.6s ease forwards;
    }
    .match-row:hover{
      transform:translateX(8px) scale(1.01);
      box-shadow:var(--card-shadow-hover);
      border-color:var(--accent);
    }

    /* Staggered Entrance */
    .match-row:nth-child(1) { animation-delay: 0.05s; }
    .match-row:nth-child(2) { animation-delay: 0.08s; }
    .match-row:nth-child(3) { animation-delay: 0.11s; }
    .match-row:nth-child(4) { animation-delay: 0.14s; }
    .match-row:nth-child(5) { animation-delay: 0.17s; }
    .match-row:nth-child(6) { animation-delay: 0.20s; }
    .match-row:nth-child(7) { animation-delay: 0.23s; }
    .match-row:nth-child(8) { animation-delay: 0.26s; }
    .match-row:nth-child(9) { animation-delay: 0.29s; }
    .match-row:nth-child(10) { animation-delay: 0.32s; }
    .match-row:nth-child(11) { animation-delay: 0.35s; }
    .match-row:nth-child(12) { animation-delay: 0.38s; }
    .match-row:nth-child(13) { animation-delay: 0.41s; }
    .match-row:nth-child(14) { animation-delay: 0.44s; }
    .match-row:nth-child(15) { animation-delay: 0.47s; }
    .match-row:nth-child(16) { animation-delay: 0.50s; }
    .match-row:nth-child(17) { animation-delay: 0.53s; }
    .match-row:nth-child(18) { animation-delay: 0.56s; }
    .match-row:nth-child(19) { animation-delay: 0.59s; }
    .match-row:nth-child(20) { animation-delay: 0.62s; }
    .match-row:nth-child(21) { animation-delay: 0.65s; }
    .match-row:nth-child(22) { animation-delay: 0.68s; }
    .match-row:nth-child(23) { animation-delay: 0.71s; }
    .match-row:nth-child(24) { animation-delay: 0.74s; }
    .match-row:nth-child(25) { animation-delay: 0.77s; }
    .match-row:nth-child(26) { animation-delay: 0.80s; }
    .match-row:nth-child(27) { animation-delay: 0.83s; }
    .match-row:nth-child(28) { animation-delay: 0.86s; }
    .match-row:nth-child(29) { animation-delay: 0.89s; }
    .match-row:nth-child(30) { animation-delay: 0.92s; }

    @keyframes slideUpFade {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .match-row .date-cell{font-size:12px;color:var(--ink2);font-weight:500;line-height:1.3}
    .match-row .date-cell b{color:var(--ink);font-weight:700;display:block;font-size:13px}
    .match-row .clay{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .match-row .clay img{width:100%;height:100%;object-fit:contain}
    .match-row .team{font-size:15px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .match-row .team.away{text-align:right}
    .match-row .team.lose{color:var(--ink3);font-weight:500}
    .match-row .mid{text-align:center}
    .match-row .vs{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em}
    .match-row .score{font-family:var(--serif);font-size:18px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
    .match-row.is-live .score{color:#1a9c5b}
    html.dark .match-row.is-live .score{color:#4fd089}
    .match-row .score .pen{font-size:9px;font-weight:600;color:var(--ink3);display:block;margin-top:3px;font-family:var(--sans);letter-spacing:.02em}
    .match-row .badge{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
    .badge.upcoming{background:var(--bg2);color:var(--ink3)}
    .badge.finished{background:rgba(26,20,16,.06);color:var(--ink2)}
    html.dark .badge.finished{background:rgba(244,237,226,.06)}
    .badge.live-badge{background:rgba(26,156,91,.12);color:#1a9c5b}
    html.dark .badge.live-badge{background:rgba(79,208,137,.12);color:#4fd089}
    .badge.live-badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;animation:bpulse 1.4s ease infinite}
    @keyframes bpulse{0%,100%{opacity:1}50%{opacity:.25}}
    .match-row .venue-cell{font-size:11px;color:var(--ink2);line-height:1.4;text-align:right}
    .match-row .venue-cell b{color:var(--ink);font-weight:600;display:block;font-size:12px}

    .empty-state{text-align:center;padding:72px 20px;color:var(--ink2)}
    .empty-state p{font-size:16px;margin-top:8px}

    .footer{
      border-top:1px solid var(--line);
      padding:32px clamp(20px,3vw,40px);
      display:flex;justify-content:space-between;align-items:baseline;
      font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);
      max-width:1280px;margin:0 auto;
    }
    .footer b{color:var(--ink);font-weight:600}

    @media(max-width:900px){
      .match-row{grid-template-columns:56px 40px 1fr 60px 1fr 40px;gap:8px}
      .match-row .venue-cell{display:none}
    }
    @media(max-width:600px){
      .top-nav{display:none!important}
      .match-row{grid-template-columns:44px 1fr 54px 1fr;gap:8px;padding:12px}
      .match-row .date-cell,.match-row .clay{display:none}
      .match-row .team{font-size:13px}
      .filter-bar{justify-content:center}
      .filter-bar button{font-size:11px;padding:5px 12px}
    }
  </style>
</head>
<body>

<div class="top-bar" id="topBar"></div>
<a class="brand-logo" href="./index.html">World Cup 2026</a>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.93" y1="4.93" x2="7" y2="7"/><line x1="17" y1="17" x2="19.07" y2="19.07"/><line x1="4.93" y1="19.07" x2="7" y2="17"/><line x1="17" y1="7" x2="19.07" y2="4.93"/></svg>
</button>

<nav class="top-nav" id="topNav">
  <a href="./stadiums.html">Stadiums</a>
  <a href="./teams.html">Teams</a>
  <a href="./matches.html" class="active">Matches</a>
  <a href="./standings.html">Standings</a>
  <a href="./live.html">Live</a>
</nav>

<main>
  <a class="back-link" href="./index.html">← Home</a>

  <div class="page-header">
    <h1>Matches</h1>
    <p>All 104 fixtures · Jun 11 – Jul 19</p>
  </div>

  <!-- ─── FILTER BAR ─── -->
  <div class="filter-bar" id="filterBar">
    <button class="active" data-stage="all">All</button>
    <button data-stage="group">Group</button>
    <button data-stage="R32">R32</button>
    <button data-stage="R16">R16</button>
    <button data-stage="QF">QF</button>
    <button data-stage="SF">SF</button>
    <button data-stage="Final">Final</button>
  </div>

  <div class="match-list" id="matchList"></div>
</main>

<footer class="footer">
  <span>© <b>Saifis Works</b> · 2026</span>
  <span><b>Drop №058</b> · The Cup</span>
</footer>

<script>
  const themeToggle = document.getElementById('themeToggle');
  const topBar = document.getElementById('topBar');
  function applyTheme(t){ document.documentElement.classList.toggle('dark', t === 'dark'); }
  const saved = localStorage.getItem('wc.theme');
  const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (sysDark ? 'dark' : 'light'));
  themeToggle.addEventListener('click', () => {
    const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
    applyTheme(next);
    localStorage.setItem('wc.theme', next);
  });
  window.addEventListener('scroll', () => {
    topBar.classList.toggle('scrolled', window.scrollY > 20);
  });
</script>

<script src="./data.js"></script>
<script src="./wc-live.js"></script>
<script>
  (function(){
    const HOME_SLUG = {'Curaçao':'cura-ao',"Côte d'Ivoire":'c-te-d-ivoire','Türkiye':'t-rkiye'};
    function homeSlug(n){ return HOME_SLUG[n]||(n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')); }
    function isRealTeam(n){ if(!n||n==='To be announced') return false; if(/^\d/.test(n)) return false; return true; }
    const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    function monthDay(d){ const dt=new Date(d); return `${MONTHS[dt.getUTCMonth()]} ${dt.getUTCDate()}`; }
    function weekday(d){ return DAYS[new Date(d).getUTCDay()]; }

    const allRaw = [];
    (window.WC.venues||[]).forEach(v => {
      (v.matches||[]).forEach(m => {
        if(!allRaw.find(x=>x.n===m.n)) allRaw.push({...m, venue:v});
      });
    });
    allRaw.sort((a,b)=>a.date.localeCompare(b.date)||(a.kick||'').localeCompare(b.kick||''));

    let stageFilter = 'all';

    function stageGroup(g){
      if(!g||g==='') return 'group';
      const ku = g.toUpperCase();
      if(['A','B','C','D','E','F','G','H','I','J','K','L'].includes(ku)) return 'group';
      if(ku==='R32') return 'R32';
      if(ku==='R16') return 'R16';
      if(ku==='QF') return 'QF';
      if(ku==='SF'||ku==='3P') return 'SF';
      if(ku==='FINAL') return 'Final';
      return 'group';
    }

    function matchesStage(m){
      if(stageFilter==='all') return true;
      return stageGroup(m.group||'') === stageFilter;
    }

    function render(live){
      const list = allRaw.filter(m => matchesStage(m));
      const el = document.getElementById('matchList');
      if(!list.length){
        el.innerHTML=`<div class="empty-state"><div style="font-size:32px">🏟️</div><p>No matches found for this filter.</p></div>`;
        return;
      }
      let html='', lastDate='';
      list.forEach(m=>{
        const r = live && live[m.n];
        const done = !!(r&&r.status===0);
        const isLive = !!(r&&r.status===3);

        if(m.date!==lastDate){
          lastDate=m.date;
          const dt=new Date(m.date);
          html+=`<div class="date-group-head">${DAYS[dt.getUTCDay()]}, ${MONTHS[dt.getUTCMonth()]} ${dt.getUTCDate()}</div>`;
        }

        const homeImg = isRealTeam(m.home)?`<img src="./homes/${homeSlug(m.home)}.webp" alt="">`:'';
        const awayImg = isRealTeam(m.away)?`<img src="./homes/${homeSlug(m.away)}.webp" alt="">`:'';

        let midHtml, rowClass='', homeCls='team', awayCls='team away', badgeHtml='';
        if(done||isLive){
          const pen=(r.hp!=null&&r.ap!=null)?`<span class="pen">pens ${r.hp}–${r.ap}</span>`:'';
          midHtml=`<div class="mid"><span class="score">${r.hs}<span style="opacity:.3;margin:0 3px">-</span>${r.as}${pen}</span></div>`;
          if(done){
            rowClass='is-done';
            badgeHtml=`<span class="badge finished">Full time</span>`;
            if(r.winner){ if(r.winner===m.home) awayCls+=' lose'; else if(r.winner===m.away) homeCls+=' lose'; }
          } else {
            rowClass='is-live';
            badgeHtml=`<span class="badge live-badge">Live</span>`;
          }
        } else {
          midHtml=`<div class="mid"><span class="vs">vs</span></div>`;
          badgeHtml=`<span class="badge upcoming">${m.kick||'TBC'}</span>`;
        }

        html+=`
          <a class="match-row ${rowClass}" href="./match.html?n=${m.n}">
            <span class="date-cell"><b>${monthDay(m.date)}</b>${weekday(m.date)}</span>
            <span class="clay">${homeImg}</span>
            <span class="${homeCls}">${m.home}</span>
            ${midHtml}
            <span class="${awayCls}">${m.away}</span>
            <span class="venue-cell"><b>${m.venue.stadium}</b>${m.venue.city}</span>
          </a>`;
      });
      el.innerHTML=html;
    }

    document.getElementById('filterBar').addEventListener('click',e=>{
      const btn=e.target.closest('.filter-btn');
      if(!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      stageFilter=btn.dataset.stage;
      render(window._liveMap||null);
    });

    render(null);
    if(window.WCLive){
      WCLive.load().then(o=>{ window._liveMap=o.map; render(o.map); }).catch(()=>{});
    }
  })();
</script>

<script src="./mobile-nav.js"></script>
</body>
</html>
